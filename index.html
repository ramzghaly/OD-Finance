<script type="module">
/* ربط السيستم بقاعدة بيانات Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { initializeFirestore, doc, collection, getDoc, setDoc, deleteDoc, onSnapshot, query, limit, getDocs, orderBy, startAfter, documentId } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const OWNER = window.WD_OWNER;
let CFG = window.WD_CFG;
if (!CFG) { try { CFG = JSON.parse(localStorage.getItem(window.WD_CFG_KEY) || "null"); } catch (e) { CFG = null; } }

function pasteUI() {
  const a = document.getElementById("app"); if (!a) return;
  a.innerHTML = '<div class="panel gate"><h2>ربط السيستم بقاعدة البيانات</h2><p class="small muted">أول مرة بس: من Firebase افتح Project settings ثم Your apps، وانسخ كود firebaseConfig كله والصقه هنا.</p><textarea id="cfgIn" rows="9" dir="ltr" placeholder="const firebaseConfig = { apiKey: ... }"></textarea><div class="err" id="cfgErr"></div><button class="btn pri" id="cfgSave">حفظ وفتح السيستم</button></div>';
  document.getElementById("cfgSave").onclick = () => {
    const t = document.getElementById("cfgIn").value, err = document.getElementById("cfgErr");
    try {
      let j = t.slice(t.indexOf("{", Math.max(0, t.indexOf("firebaseConfig"))));
      j = j.slice(0, j.indexOf("}") + 1).replace(/\/\/.*$/gm, "").replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, "}");
      const c = JSON.parse(j); if (!c.apiKey || !c.projectId) throw 0;
      localStorage.setItem(window.WD_CFG_KEY, JSON.stringify(c)); location.reload();
    } catch (e) { err.textContent = "الإعدادات دي مش مظبوطة. انسخ firebaseConfig كله من Firebase وجرّب تاني."; }
  };
}

// يكتشف اسم قاعدة البيانات في المشروع: (default) أو default
async function detectDb() {
  const key = "fb.dbid." + CFG.projectId;
  const cached = localStorage.getItem(key); if (cached) return cached;
  for (const id of ["(default)", "default"]) {
    try {
      const r = await fetch("https://firestore.googleapis.com/v1/projects/" + CFG.projectId + "/databases/" + id + "/documents/sectors?pageSize=1&key=" + CFG.apiKey);
      if (r.status !== 404) { localStorage.setItem(key, id); return id; }
    } catch (e) {}
  }
  return "(default)";
}

async function start() {
  if (!CFG || !CFG.apiKey || !CFG.projectId) { window.__fbResolve(null); setTimeout(pasteUI, 60); return; }
  try {
    const app = initializeApp(CFG);
    const DBID = await detectDb();
    window.__fbDbId = DBID;
    const fs = initializeFirestore(app, { ignoreUndefinedProperties: true, experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false }, DBID);

    const authReady = new Promise(res => { const un = onAuthStateChanged(auth, () => { un(); res(); }); });

    const wrapSnap = s => ({ exists: s.exists(), id: s.id, data: () => s.data() });
    const wrapQuery = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
    const ref = p => ({ id: p.split("/").pop(), get: async () => wrapSnap(await getDoc(doc(fs, p))), set: d => setDoc(doc(fs, p), d), delete: () => deleteDoc(doc(fs, p)) });
    const db = {
      doc: ref,
      collection: name => ({
        doc: () => { const r = doc(collection(fs, name)); return ref(name + "/" + r.id); },
        limit: n => ({
          onSnapshot: (cb, err) => onSnapshot(query(collection(fs, name), limit(n)), s => cb(wrapQuery(s)), err),
          get: async () => wrapQuery(await getDocs(query(collection(fs, name), limit(n))))
        })
      })
    };

    const toVal = v => {
      if (v === null || v === undefined) return { nullValue: null };
      if (typeof v === "boolean") return { booleanValue: v };
      if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
      if (typeof v === "string") return { stringValue: v };
      if (Array.isArray(v)) return { arrayValue: v.length ? { values: v.map(toVal) } : {} };
      const f = {}; Object.keys(v).forEach(k => { if (v[k] !== undefined) f[k] = toVal(v[k]); }); return { mapValue: { fields: f } };
    };

    const usr = {
      ownerEmail: OWNER,
      isOwner: async () => { await authReady; return !!(auth.currentUser && auth.currentUser.email === OWNER); },
      signInWithPassword: async (email, pw) => { await signInWithEmailAndPassword(auth, email, pw); try { await auth.currentUser.getIdToken(true); } catch (e) {} await new Promise(r => setTimeout(r, 800)); return !!(auth.currentUser && auth.currentUser.email === OWNER); },
      refresh: async () => { try { if (auth.currentUser) await auth.currentUser.getIdToken(true); } catch (e) {} },
      signOutOwner: async () => { if (auth.currentUser) await signOut(auth); },
      sdkExport: async (cols, onProgress) => {
        const out = {}; let n = 0;
        for (const c of cols) {
          let last = null;
          for (;;) {
            const q = last ? query(collection(fs, c), orderBy(documentId()), startAfter(last), limit(200)) : query(collection(fs, c), orderBy(documentId()), limit(200));
            const s = await getDocs(q);
            for (const d of s.docs) { (out[c] = out[c] || {})[d.id] = d.data(); n++; }
            if (onProgress) onProgress(n, c);
            if (s.docs.length < 200) break;
            last = s.docs[s.docs.length - 1].id;
          }
        }
        return out;
      },
      restExport: async (cols, onProgress) => {
        const base = "https://firestore.googleapis.com/v1/projects/" + CFG.projectId + "/databases/" + DBID + "/documents/";
        const fromVal = v => {
          if ("nullValue" in v) return null;
          if ("booleanValue" in v) return v.booleanValue;
          if ("integerValue" in v) return Number(v.integerValue);
          if ("doubleValue" in v) return v.doubleValue;
          if ("stringValue" in v) return v.stringValue;
          if ("timestampValue" in v) return v.timestampValue;
          if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromVal);
          if ("mapValue" in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = fromVal(f[k]); return o; }
          return null;
        };
        const out = {}; let n = 0;
        for (const c of cols) {
          let token = "";
          do {
            const idt = await auth.currentUser.getIdToken();
            const res = await fetch(base + c + "?pageSize=100" + (token ? "&pageToken=" + encodeURIComponent(token) : ""), { headers: { "Authorization": "Bearer " + idt } });
            if (!res.ok) { let t = ""; try { t = (await res.json()).error.message; } catch (e) {} const er = new Error("HTTP " + res.status + (t ? " — " + t : "") + " [" + c + "]"); er.code = res.status === 403 ? "permission-denied" : "http-" + res.status; throw er; }
            const j = await res.json();
            for (const d of (j.documents || [])) { const id = d.name.split("/").pop(); (out[c] = out[c] || {})[id] = fromVal({ mapValue: { fields: d.fields || {} } }); n++; }
            if (onProgress) onProgress(n, c);
            token = j.nextPageToken || "";
          } while (token);
        }
        return out;
      },
      restImport: async (items, onProgress) => {
        const base = "projects/" + CFG.projectId + "/databases/" + DBID + "/documents";
        const batches = []; let cur = [], size = 0;
        for (const it of items) {
          const w = { update: { name: base + "/" + it[0] + "/" + it[1], fields: toVal(it[2]).mapValue.fields } }, l = JSON.stringify(w).length;
          if (cur.length && (cur.length >= 400 || size + l > 3500000)) { batches.push(cur); cur = []; size = 0; }
          cur.push(w); size += l;
        }
        if (cur.length) batches.push(cur);
        let done = 0;
        for (const b of batches) {
          const token = await auth.currentUser.getIdToken();
          const res = await fetch("https://firestore.googleapis.com/v1/" + base + ":commit", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify({ writes: b }) });
          if (!res.ok) { let t = ""; try { t = (await res.json()).error.message; } catch (e) {} const er = new Error("HTTP " + res.status + (t ? " — " + t : "")); er.code = res.status === 403 ? "permission-denied" : "http-" + res.status; er.detail = t; throw er; }
          done += b.length; if (onProgress) onProgress(done);
        }
        return done;
      }
    };
    const downloads = { save: async o => { const a = document.createElement("a"); a.href = URL.createObjectURL(o.data); a.download = o.filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); } };
    await authReady;
    window.__fbResolve({ use: async n => n === "db" ? db : n === "user" ? usr : n === "downloads" ? downloads : null });
  } catch (e) {
    console.error(e); window.__fbInitErr = (e && (e.code || e.message)) || String(e); window.__fbResolve(null);
  }
}
start();

<script>
(function(){
const ROLES={head:{lv:7,t:'رئيس القطاع المالي'},manager:{lv:6,t:'مدير حسابات'},chief:{lv:5,t:'رئيس حسابات'},assistant:{lv:4,t:'مساعد رئيس حسابات'},section:{lv:3,t:'رئيس قسم'},reviewer:{lv:2,t:'مراجع حسابات'},accountant:{lv:1,t:'محاسب'}};
const LVROLE={7:'head',6:'manager',5:'chief',4:'assistant',3:'section',2:'reviewer',1:'accountant'};
let SECTORS={},SECDATA={},DEPTS={};
const deptsOf=k=>Object.keys(DEPTS).filter(d=>DEPTS[d].sector===k).sort((a,b)=>(DEPTS[a].order||0)-(DEPTS[b].order||0));
const pDepts=(p,k)=>(p.depts||[]).filter(d=>DEPTS[d]&&DEPTS[d].sector===k).map(d=>DEPTS[d].name);
const isGhost=(p,k)=>!!p&&(p.ghost||[]).includes(k);
const pDeptIds=(p,k)=>(p.depts||[]).filter(d=>DEPTS[d]&&DEPTS[d].sector===k);
function stepMatch(p,s,k){if(!s.dm)return true;const d=pDeptIds(p,k);return s.dm==='gen'?!d.length:d.some(x=>s.dm.includes(x))}
function midSteps(k,from,toLv,dsel){const fd=dsel?[dsel]:pDeptIds(from,k),out=[];for(let l=lv(from)+1;l<toLv;l++){const c0=people().filter(p=>p.active!==false&&has(p,k)&&lv(p)===l),c=c0.filter(p=>!isGhost(p,k));if(!c.length){const g=c0[0];if(g)out.push({lv:l,who:g.no,ghost:g.ghostAs||''});continue}
  if(!fd.length){out.push({lv:l,who:null});continue}
  if(c.some(p=>pDeptIds(p,k).some(d=>fd.includes(d)))){out.push({lv:l,who:null,dm:fd});continue}
  if(c.some(p=>!pDeptIds(p,k).length))out.push({lv:l,who:null,dm:'gen'})}return out}
function deptOk(u,t){const ud=pDeptIds(u,t.sector);if(!ud.length)return true;const a=staff[t.chain[0].who],ad=t.dept?[t.dept]:a?pDeptIds(a,t.sector):[];return !ad.length||ad.some(d=>ud.includes(d))}
const dTxt=(p,k)=>{const n=pDepts(p,k);return n.length?' · '+n.join('، '):''};
const tt=p=>(p&&p.title)||ROLES[p.role].t;
const has=(p,k)=>(p.sectors||[]).includes(k);
const secs=p=>p.role==='head'?Object.keys(SECTORS):(p.sectors||[]).filter(k=>SECTORS[k]);
const secName=k=>SECTORS[k]||'قطاع محذوف';
const secList=p=>p.role==='head'?'كل القطاعات':(p.sectors||[]).map(k=>{const n=pDepts(p,k);return secName(k)+(n.length?' ('+n.join('، ')+')':'')}).join(' + ')||'بدون قطاع';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lv=p=>ROLES[p.role].lv;
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fD=s=>{if(!s)return '—';const d=new Date(s.length===10?s+'T00:00':s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const fDT=s=>{if(!s)return '';const d=new Date(s);return fD(s)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function hash(no,pin){let s=no+':'+pin+':wdfin',h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16)}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

const H={};let codeOK=false,PINS={};let recurs=[],recurReady=false,lastSync=null,db=null,usr=null,staff={},tasks=[],staffReady=false,tasksReady=false,meNo=ls.get('od_me'),tab='mine',open=new Set();
let F={status:'all',sector:'all',from:'',to:'',q:''},starMonth='all',draft={title:'',desc:'',sector:'',to:'',due:today(),prio:'normal',rep:'once',day:'1',days:'1'};
const pinOf=p=>(PINS[p.no]&&PINS[p.no].pin)||p.pin;
const me=()=>{const p=staff[meNo];return p&&p.active!==false?p:null};
const people=()=>Object.values(staff).sort((a,b)=>lv(b)-lv(a)||String(a.no).localeCompare(String(b.no),undefined,{numeric:true}));

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}
function werr(e){toast(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'لا تملك صلاحية لهذا الإجراء.':'تعذر الحفظ الآن. حاول مرة أخرى.')}

/* ---------- ratings ---------- */
function ratings(){const r={};for(const t of tasks)for(const s of t.chain||[])if(s.score!=null&&s.who){if(starMonth!=='all'&&tab==='team'&&String(s.scoredAt||'').slice(0,7)!==starMonth)continue;(r[s.who]=r[s.who]||[]).push(s.score)}return r}
function allRatings(){const r={};for(const t of tasks)for(const s of t.chain||[])if(s.score!=null&&s.who)(r[s.who]=r[s.who]||[]).push(s.score);return r}
const STAR='<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>';
function stars(arr,big){const n=arr&&arr.length,avg=n?arr.reduce((a,b)=>a+b,0)/n:0,on=n?Math.round(avg/2):0;let h='<span class="stars'+(big?' big':'')+'" role="img" aria-label="'+on+' من 5 نجوم">';for(let i=1;i<=5;i++)h+='<svg viewBox="0 0 24 24" class="'+(i<=on?'on':'')+'">'+STAR+'</svg>';h+='</span>';return h+' <span class="small muted num">'+(n?avg.toFixed(1)+'/10 · '+n+' تقييم':'')+'</span>'+(n?'':'<span class="small muted">لا تقييم بعد</span>')}
function av(p,c){const init=p?String(p.name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join(' '):'؟';return '<span class="av '+(c||'')+'">'+(p&&p.photo?'<img alt="" src="'+esc(p.photo)+'">':esc(init))+'</span>'}

/* ---------- task rules ---------- */
const visible=(t,u)=>u.role==='head'||t.createdBy===u.no||t.chain.some(s=>s.who===u.no||(!s.who&&has(u,t.sector)&&lv(u)===s.lv&&stepMatch(u,s,t.sector)))||(has(u,t.sector)&&lv(u)>t.chain[0].lv&&deptOk(u,t));
function canAct(t,u){if(t.status!=='open')return false;const s=t.chain[t.cur];return s.who?s.who===u.no:(has(u,t.sector)&&lv(u)===s.lv&&stepMatch(u,s,t.sector))}
const overdue=t=>t.status==='open'&&t.due&&t.due<today();
function holders(t,s){if(s.who)return staff[s.who]?[staff[s.who]]:[];return people().filter(p=>p.active!==false&&has(p,t.sector)&&lv(p)===s.lv&&stepMatch(p,s,t.sector)&&!isGhost(p,t.sector))}
function buildChain(sector,to,by,dsel){const c=[{lv:lv(to),who:to.no}].concat(midSteps(sector,to,lv(by),dsel));c.push({lv:lv(by),who:by.no,final:true});return c}
const REP={once:'مرة واحدة',daily:'يومية',weekly:'أسبوعية',monthly:'شهرية',quarterly:'ربع سنوية',half:'نصف سنوية'};
const WD=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return dkey(d)};
function occurs(r,ds){const d=new Date(ds+'T00:00'),day=+r.day||1,m=d.getMonth(),dim=new Date(d.getFullYear(),m+1,0).getDate(),dm=d.getDate()===Math.min(day,dim);
  if(r.rep==='daily')return true;if(r.rep==='weekly')return (d.getDay()+1)%7+1===Math.min(day,7);
  if(r.rep==='monthly')return dm;if(r.rep==='quarterly')return m%3===0&&dm;if(r.rep==='half')return m%6===0&&dm;return false}
function nextOcc(r,from){let d=from||today();for(let i=0;i<400;i++,d=addD(d,1))if(occurs(r,d))return d;return ''}
function dayLabel(r){return r.rep==='daily'?'كل يوم':r.rep==='weekly'?'يوم '+r.day+' ('+WD[(+r.day||1)-1]+')':'يوم '+r.day}
function nextNo(ds){const d=ds?new Date(ds+'T00:00'):new Date(),k=String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate());const n=tasks.filter(t=>String(t.no||'').startsWith(k)).length+1;return k+'-'+pad(n)}

/* ---------- chrome ---------- */
function chrome(){const u=me(),box=$('#meBox'),tb=$('#tabs');if(!u){box.hidden=tb.hidden=true;return}
  box.hidden=tb.hidden=false;
  box.innerHTML=av(u)+'<div class="who"><b>'+esc(u.name)+'</b><span class="small muted"><span class="num">'+esc(u.no)+'</span> · '+esc(tt(u))+' · '+esc(secList(u))+'</span><div>'+stars(allRatings()[u.no])+'</div></div><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;gap:4px"><button class="btn sm" data-act="pin">الرقم السري</button><button class="btn sm" data-act="logout">خروج</button></div><button class="btn sm" data-act="sync" id="syncBtn">تحديث البيانات</button><span class="small muted" style="text-align:center">آخر تحديث <span class="num">'+(lastSync?pad(lastSync.getHours())+':'+pad(lastSync.getMinutes())+':'+pad(lastSync.getSeconds()):'—')+'</span></span></div>';
  const n=tasks.filter(t=>visible(t,u)&&canAct(t,u)).length;
  const T=[['mine','دوري الآن'+(n?'<span class="badge num">'+n+'</span>':'')],['track','متابعة المهام']];
  if(lv(u)>1)T.push(['new','مهمة جديدة']);if(lv(u)>1)T.push(['report','تقرير المهام']);T.push(['team','الفريق والتقييم']);if(u.role==='head')T.push(['coding','التكويد']);
  if(!T.some(x=>x[0]===tab))tab='mine';
  tb.innerHTML=T.map(x=>'<button class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>').join('')}

/* ---------- views ---------- */
function refresh(){chrome();if(me()&&tab==='new'&&$('#nt_title'))return;if(me()&&tab==='track'&&$('#list'))return drawTrack();view()}
function view(){const a=$('#app');
  if(!db){a.innerHTML='<div class="empty">'+(db===null&&view.tried?'تعذر الاتصال بقاعدة البيانات. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.'+(window.__fbInitErr?' ('+esc(window.__fbInitErr)+')':''):'جارٍ تحميل البيانات…')+'</div>';return}
  if(!staffReady){a.innerHTML='<div class="empty">جارٍ تحميل البيانات…</div>';return}
  if(!Object.keys(staff).length)return setupView(a);
  const u=me();if(!u)return loginView(a);
  if(tab==='mine')return mineView(a,u);if(tab==='track')return trackView(a,u);if(tab==='new')return newView(a,u);if(tab==='team')return teamView(a,u);if(tab==='report')return repView(a,u);if(!codeOK||u.role!=='head'){tab='mine';chrome();return mineView(a,u)}return codingView(a,u)}

function setupView(a){a.innerHTML='<form class="panel gate" id="setupF"><h2>أول تشغيل: حساب رئيس القطاع</h2><p class="muted small">سجّل بياناتك أولاً، ثم أضف باقي الفريق من صفحة التكويد.</p><label><span>رقم الموظف</span><input id="su_no" inputmode="numeric" required></label><label><span>الاسم</span><input id="su_name" required></label><label><span>رقم سري (3 أرقام أو أكثر)</span><input id="su_pin" type="password" inputmode="numeric" minlength="3" required></label><div class="err" id="su_err"></div><button class="btn pri">إنشاء الحساب والدخول</button></form><div class="panel gate" style="margin-top:14px;background:var(--sunk)"><h3>عندك بيانات من السيستم القديم على Claude؟</h3><p class="small muted">متعملش حساب جديد. استورد ملف البيانات <b>wd-finance-data.json</b> وهيتنقل كل الموظفين والقطاعات والأقسام والمهام.</p><button type="button" class="btn pri" data-act="impStart">استيراد ملف البيانات</button><div id="impMsg" class="small" style="min-height:1.2em"></div></div>'}
function loginView(a){a.innerHTML='<form class="panel gate" id="loginF"><h2>تسجيل الدخول</h2><label><span>رقم الموظف</span><input id="li_no" inputmode="numeric" autocomplete="username" required></label><div id="li_who" class="row small muted"></div><label><span>الرقم السري</span><input id="li_pin" type="password" inputmode="numeric" autocomplete="current-password" required></label><div class="err" id="li_err"></div><button class="btn pri">دخول</button></form>'}

function card(t,u){const act=canAct(t,u),cr=staff[t.createdBy],isOpen=open.has(t.id),sg=u.role==='head'||t.chain.some(s=>s.ghost&&s.who===u.no),gm={},gc=t.status==='open'&&t.chain[t.cur]&&t.chain[t.cur].ghost&&!sg;if(!sg)t.chain.forEach(s=>{if(s.ghost)gm[s.who]=s.ghost});
  let st=t.status==='closed'?'<span class="pill">منتهية · مقفولة</span>':overdue(t)?'<span class="pill bad">متأخرة</span>':'<span class="pill acc">جارية</span>';
  let h='<article class="task'+(act?' mine':'')+(t.status==='closed'?' closed':'')+'"><div class="thead"><div class="t"><div class="tno num">T-'+esc(t.no)+'</div><h3>'+esc(t.title)+'</h3></div><div class="pills">'+st+(t.prio==='urgent'?'<span class="pill warn">عاجلة</span>':'')+(t.recur?'<span class="pill acc">متكررة · '+esc(REP[t.rep]||'')+'</span>':'')+'<span class="pill">'+esc(secName(t.sector))+'</span></div></div>';
  h+='<div class="row small muted"><span>أنشأها: '+esc(cr?cr.name:t.createdBy)+'</span><span>بتاريخ <span class="num">'+fDT(t.createdAt)+'</span></span><span>الاستحقاق <span class="num">'+fD(t.due)+'</span></span>'+(t.closedAt?'<span>أُغلقت <span class="num">'+fDT(t.closedAt)+'</span></span>':'')+'</div>';
  h+='<div class="track">'+t.chain.map((s,i)=>{if(s.ghost&&!sg)return '';const done=t.status==='closed'||i<t.cur,cur=t.status==='open'&&(i===t.cur||(gc&&s.final)),hs=holders(t,s),p=hs[0];
    return '<div class="step '+(done?'done':cur?'cur':'')+'">'+av(p)+'<b>'+esc(hs.length?hs.map(x=>x.name).join(' / '):s.who?'موظف '+s.who:ROLES[LVROLE[s.lv]].t)+'</b><span class="muted">'+esc(p?tt(p):ROLES[LVROLE[s.lv]].t)+(s.final?' · اعتماد':'')+'</span><span class="st">'+(done?(s.skipped?'تخطّى ':'تم ')+'<span class="num">'+fDT(s.doneAt)+'</span>':cur?'عنده الآن':s.skipped?'سيتم تخطّيه':'في الانتظار')+'</span>'+cskipBtn(t,s,i,u)+(s.score!=null&&seeScore(u,s)?'<span class="num">التقييم '+s.score+'/10</span>':'')+'</div>'}).join('')+'</div>';
  if((t.files||[]).length)h+='<div class="row small"><span class="muted">المرفقات:</span>'+t.files.map(f=>'<button class="btn sm" data-act="fview" data-id="'+t.id+'" data-f="'+esc(f.id)+'">'+esc(f.name)+' <span class="num muted">('+fsz(f.size)+')</span></button>').join('')+'</div>';
  h+='<div class="row">';if(act){const s=t.chain[t.cur];h+='<button class="btn pri" data-act="done" data-id="'+t.id+'">'+(s.final?'اعتماد وإغلاق المهمة':'انتهاء المهمة')+'</button>';if(prevIdx(t)>=0)h+='<button class="btn" data-act="back" data-id="'+t.id+'">إرجاع للتعديل</button>';}
  if(canFwd(t,u))h+='<button class="btn" data-act="fwd" data-id="'+t.id+'">تحويل المهمة لآخر</button>';if(t.status==='open')h+='<button class="btn" data-act="fadd" data-id="'+t.id+'">إرفاق ملف</button>';if(t.status==='open'&&(t.createdBy===u.no||u.role==='head'))h+='<button class="btn" data-act="editt" data-id="'+t.id+'">تعديل المهمة</button>';if(canDel(t,u))h+='<button class="btn danger" data-act="delt" data-id="'+t.id+'">حذف المهمة</button>';h+='<span class="sp"></span><button class="btn sm" data-act="toggle" data-id="'+t.id+'">'+(isOpen?'إخفاء التفاصيل':'التفاصيل وسجل الحركة')+'</button></div>';
  if(isOpen){h+='<div class="log">'+(t.desc?'<div class="desc">'+esc(t.desc)+'</div>':'')+(t.log||[]).map(l=>{const p=staff[gm[l.by]||l.by];const w={create:'أنشأ المهمة',done:'أنهى دوره',back:'أرجع المهمة للتعديل',skip:'تخطّى دوره ومرّر المهمة',cskip:'تخطّى دوراً في المهمة',unskip:'ألغى تخطّي دور',edit:'عدّل بيانات المهمة',fwd:'حوّل المهمة',file:'أرفق ملفات',fdel:'حذف مرفقاً',close:'اعتمد وأغلق المهمة'}[l.act]||l.act;return '<div><time class="num">'+fDT(l.at)+'</time><span><b>'+esc(p?p.name:l.by)+'</b> '+w+(l.score!=null&&seeLog(t,l,u)?' · قيّم السابق <span class="num">'+l.score+'/10</span>':'')+(l.note?' — '+esc(l.note):'')+'</span></div>'}).join('')+'</div>'}
  return h+'</article>'}

function mineView(a,u){const l=tasks.filter(t=>visible(t,u)&&canAct(t,u)).sort((x,y)=>(x.due||'9').localeCompare(y.due||'9'));
  a.innerHTML=l.length?'<div class="list">'+l.map(t=>card(t,u)).join('')+'</div>':'<div class="empty">لا توجد مهام في انتظارك الآن.<br>المهام تظهر هنا عندما يحين دورك في الدورة.</div>'}

function trackView(a,u){a.innerHTML='<div class="list"><div class="stats" id="stats"></div><div class="grid"><label><span>الحالة</span><select id="f_status"><option value="all">الكل</option><option value="open">جارية</option><option value="late">متأخرة</option><option value="closed">منتهية</option></select></label>'+(u.role==='head'?'<label><span>القطاع</span><select id="f_sector"><option value="all">كل القطاعات</option>'+Object.keys(SECTORS).map(k=>'<option value="'+k+'">'+esc(SECTORS[k])+'</option>').join('')+'</select></label>':'')+'<label><span>من تاريخ</span><input type="date" id="f_from"></label><label><span>إلى تاريخ</span><input type="date" id="f_to"></label><label><span>بحث</span><input id="f_q" placeholder="عنوان أو رقم المهمة"></label></div><div class="list" id="list"></div></div>';
  for(const k in F){const e=$('#f_'+k);if(e)e.value=F[k]}drawTrack()}
function drawTrack(){const u=me();if(!u)return;const vis=tasks.filter(t=>visible(t,u)),m=today().slice(0,7);
  $('#stats').innerHTML=[['',vis.filter(t=>t.status==='open').length,'مهام جارية'],['bad',vis.filter(overdue).length,'متأخرة'],['',vis.filter(t=>canAct(t,u)).length,'في انتظاري'],['ok',vis.filter(t=>t.status==='closed'&&String(t.closedAt).slice(0,7)===m).length,'أُغلقت هذا الشهر']].map(s=>'<div class="stat '+s[0]+'"><b class="num">'+s[1]+'</b><span class="small muted">'+s[2]+'</span></div>').join('');
  const q=F.q.trim().toLowerCase();
  const l=vis.filter(t=>(F.status==='all'||(F.status==='late'?overdue(t):t.status===F.status))&&(F.sector==='all'||t.sector===F.sector)&&(!F.from||String(t.createdAt).slice(0,10)>=F.from)&&(!F.to||String(t.createdAt).slice(0,10)<=F.to)&&(!q||(t.title+' '+t.no).toLowerCase().includes(q))).sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)));
  $('#list').innerHTML=l.length?l.map(t=>card(t,u)).join(''):'<div class="empty">'+(vis.length?'لا توجد مهام تطابق الفلتر.':'لا توجد مهام بعد.'+(lv(u)>1?' ابدأ من تبويب «مهمة جديدة».':''))+'</div>'}

function dIdx(p,k){const d=pDeptIds(p,k)[0];return d?deptsOf(k).indexOf(d):-1}
function assignees(u,sec,dsel){const ud=pDeptIds(u,sec);return people().filter(p=>p.active!==false&&has(p,sec)&&lv(p)<lv(u)&&!isGhost(p,sec)&&(!ud.length||!pDeptIds(p,sec).length||pDeptIds(p,sec).some(d=>ud.includes(d)))&&(!dsel||pDeptIds(p,sec).includes(dsel))).sort((a,b)=>(dsel?0:dIdx(a,sec)-dIdx(b,sec))||lv(b)-lv(a))}
function newView(a,u){const ch=secs(u);if(!ch.includes(draft.sector))draft.sector=ch[0]||'';

const repOpen=new Set();
function inScope(q,k,E){const d=pDeptIds(q,k);return !E||!d.length||d.some(x=>E.includes(x))}
function subsOf(p,S){const ks=p.role==='head'?Object.keys(SECTORS):(p.sectors||[]),out=[];
  for(const q of people()){if(q.active===false||q.no===p.no||lv(q)>=lv(p))continue;
    for(const k of ks){if(!has(q,k))continue;const pd=pDeptIds(p,k),E=p.role==='head'?null:(S&&S.length?S:(pd.length?pd:null));
      if(!inScope(q,k,E))continue;
      if(people().some(r=>r.active!==false&&has(r,k)&&lv(r)>lv(q)&&lv(r)<lv(p)&&!isGhost(r,k)&&compat(r,q,k)&&inScope(r,k,E)))continue;
      const qd=pDeptIds(q,k);out.push([q,qd.length?(E?qd.filter(x=>E.includes(x)):qd):E]);break}}return out}
function compat(a,b,k){const da=pDeptIds(a,k),db=pDeptIds(b,k);return !da.length||!db.length||da.some(d=>db.includes(d))}
function tasksOf(p,u,S){return tasks.filter(t=>visible(t,u)&&t.chain.some(s=>s.who===p.no&&!s.final)&&(!S||(()=>{if(t.dept)return S.includes(t.dept);const a=staff[t.chain[0].who],ad=a?pDeptIds(a,t.sector):[];return !ad.length||ad.some(x=>S.includes(x))})())).sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)))}
function repNode(p,u,path,R,S){const key=path+'>'+p.no,isOpen=repOpen.has(key),ts=tasksOf(p,u,S),subs=subsOf(p,S),done=ts.filter(t=>stepDone(t,p)).length;
  let h='<div class="node"><div class="person"><button class="arrow" data-act="rep" data-id="'+esc(key)+'" aria-expanded="'+isOpen+'" aria-label="'+(isOpen?'إخفاء':'عرض')+' مهام '+esc(p.name)+'">'+(isOpen?'▾':'◂')+'</button>'+av(p)+'<div class="who"><b>'+esc(p.name)+'</b><span class="small muted"><span class="num">'+esc(p.no)+'</span> · '+esc(tt(p))+' · '+esc(secList(p))+'</span><div>'+stars(R[p.no])+'</div></div><div class="pills"><span class="pill num">'+ts.length+' مهمة</span>'+(ts.length?'<span class="pill ok num">'+done+' انتهت</span><span class="pill acc num">'+(ts.length-done)+' جارى</span>':'')+(subs.length?'<span class="pill num">تحته '+subs.length+'</span>':'')+'</div></div>';

    h+=ts.length?'<div class="tblwrap"><table class="rtbl"><thead><tr><th>رقم المهمة</th><th>المهمة</th><th>الحالة</th><th>تاريخ البداية</th><th>التقييم</th></tr></thead><tbody>'+ts.map(t=>{const st=t.chain.find(s=>s.who===p.no&&!s.final),d=stepDone(t,p);return '<tr><td class="num">T-'+esc(t.no)+'</td><td>'+esc(t.title)+'</td><td>'+(st&&st.skipped?'<span class="pill">تخطّى</span>':d?'<span class="pill ok">انتهت</span>':'<span class="pill acc">جارى العمل</span>')+(!d&&overdue(t)?' <span class="pill bad">متأخرة</span>':'')+'</td><td class="num">'+fD(t.createdAt)+'</td><td class="num">'+(st&&st.score!=null?'<b>'+st.score+'</b>/10':'—')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty small" style="padding:12px">لا توجد مهام موجَّهة إليه.</div>';
    h+=subs.map(x=>repNode(x[0],u,key,R,x[1])).join('')+'</div>'}
  return h+'</div>'}
function stepDone(t,p){if(t.status==='closed')return true;const i=t.chain.findIndex(s=>s.who===p.no&&!s.final);return i>=0&&i<t.cur}

function secLines(p){if(p.role==='head')return '<div class="small">كل القطاعات</div>';const ks=(p.sectors||[]).filter(k=>SECTORS[k]);if(!ks.length)return '<div class="small muted">بدون قطاع</div>';

function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const c=document.createElement('canvas'),S=128,m=Math.min(im.width,im.height);c.width=c.height=S;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

async function recurToggle(id){const r=recurs.find(x=>x.id===id),u=me();if(!r||!u||!(u.role==='head'||r.createdBy===u.no))return;const n=clone(r);delete n.id;n.active=r.active===false;if(n.active)n.last=addD(today(),-1);

function schedGen(){clearTimeout(schedGen.h);schedGen.h=setTimeout(genRecur,1500)}
async function genRecur(){if(!db||!me()||!staffReady||!tasksReady||!recurReady||genRecur.on)return;genRecur.on=true;let made=0;
  try{const td=today();for(const r of recurs.slice()){if(r.active===false)continue;let d=addD(r.last||addD(r.start||td,-1),1);if(d>td)continue;
      const by=staff[r.createdBy],to=staff[r.to];if(!by||!to||by.active===false||to.active===false||!has(to,r.sector))continue;
      for(let i=0;d<=td&&i<400;i++,d=addD(d,1)){if(!occurs(r,d))continue;const id='r'+r.id+'_'+d.replace(/-/g,'');if(tasks.some(x=>x.id===id))continue;
        const sn=await db.doc('tasks/'+id).get();if(sn.exists)continue;
        const at=d===td?new Date().toISOString():new Date(d+'T08:00').toISOString();
        const t={no:nextNo(d),title:r.title,desc:r.desc||'',sector:r.sector,createdBy:r.createdBy,createdAt:at,due:addD(d,+r.days||0),prio:r.prio||'normal',status:'open',cur:0,chain:buildChain(r.sector,to,by,r.dept||''),dept:r.dept||'',recur:r.id,rep:r.rep,files:clone(r.files||[]),log:[{at,by:r.createdBy,act:'create',note:'مهمة '+REP[r.rep]+' تلقائية — موجهة إلى '+to.name}]};
        await db.doc('tasks/'+id).set(t);tasks.push(Object.assign({},t,{id}));made++}
      const n=clone(r);delete n.id;n.last=td;await db.doc('recur/'+r.id).set(n);r.last=td}}
  catch(e){}finally{genRecur.on=false;if(made)refresh()}}
setInterval(schedGen,30*60*1000);

    if(Object.keys(SECTORS).some(k=>k!==id&&SECTORS[k]===name)){$('#se_err').textContent='يوجد قطاع بنفس الاسم.';return}
    if(await save(db.doc('sectors/'+id),{name,order:(SECDATA[id]&&SECDATA[id].order)||Date.now()})){closeM();toast('تم الحفظ')}}
  else if(f.id==='rdelF'&&u){const r=recurs.find(x=>x.id===f.dataset.id);if(!r||!(u.role==='head'||r.createdBy===u.no)||busy)return closeM();busy=true;try{await db.doc('recur/'+r.id).delete();recurs=recurs.filter(x=>x.id!==r.id);for(const fl of r.files||[])safeDrop(fl,r.id);closeM();view();toast('تم حذف المهمة المتكررة')}catch(err){werr(err)}finally{busy=false}}
  else if(f.id==='deptF'&&u&&u.role==='head'){const id=f.dataset.id||('d'+Date.now().toString(36)),name=$('#de_name').value.trim(),sec=$('#de_sec').value;if(!name||!SECTORS[sec])return;
    if(Object.keys(DEPTS).some(k=>k!==id&&DEPTS[k].sector===sec&&DEPTS[k].name===name)){$('#de_err').textContent='يوجد قسم بنفس الاسم في هذا القطاع.';return}
    const old=DEPTS[id];if(old&&old.sector!==sec&&people().some(p=>(p.depts||[]).includes(id))){$('#de_err').textContent='لا يمكن نقل القسم لقطاع آخر وعليه موظفون.';return}
    if(await save(db.doc('depts/'+id),{name,sector:sec,order:(old&&old.order)||Date.now()})){closeM();toast('تم الحفظ')}}
  else if(f.id==='cskipF'&&u){const o=tasks.find(x=>x.id===f.dataset.id),i=+f.dataset.i;if(!o||!o.chain[i]||!canCSkip(o,o.chain[i],i,u))return closeM();const t=clone(o),st=t.chain[i],nm=stepNames(o,o.chain[i]);
    if(f.dataset.un){if(i===t.cur)return closeM();delete st.skipped;delete st.skippedBy;delete st.note;t.log.push({at:now,by:u.no,act:'unskip',note:nm})}
    else{const note=$('#cs_note').value.trim();st.skipped=true;st.skippedBy=u.no;st.note=note;t.log.push({at:now,by:u.no,act:'cskip',note:nm+(note?' — '+note:'')});if(i===t.cur){st.doneAt=now;adv(t,now)}}
    if(await save(db.doc('tasks/'+t.id),taskBody(t))){closeM();toast(f.dataset.un?'تم إلغاء التخطّي':'تم تخطّي '+nm)}}
  else if(f.id==='ownF'){const er=$('#ow_err');er.textContent='';try{const ok=await usr.signInWithPassword($('#ow_mail').value.trim(),$('#ow_pw').value);if(!ok){er.textContent='الحساب ده مش حساب صاحب السيستم.';await usr.signOutOwner();return}closeM();if(f.dataset.next==='import')importModal();else codeGate()}
    catch(err){er.textContent=err&&(err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'||err.code==='auth/user-not-found'||err.code==='auth/invalid-login-credentials')?'الإيميل أو كلمة المرور غير صحيحة.':'تعذر الدخول: '+(err&&(err.code||err.message)||'')}}
  else if(f.id==='codeF'&&u&&u.role==='head'){let ok=false;try{const sn=await db.doc('config/coding').get();ok=sn.exists&&(sn.data()||{}).pin===cHash($('#cd_pin').value)}catch(err){}
    if(!ok){$('#cd_err').textContent='كلمة السر غير صحيحة.';$('#cd_pin').value='';return}codeOK=true;closeM();tab='coding';chrome();view()}
  else if(f.id==='codeSetF'&&u&&u.role==='head'){const n1=$('#cs_new').value,n2=$('#cs_new2').value;if(n1!==n2){$('#cs_err').textContent='التأكيد غير مطابق.';return}
    let cur=null;try{const sn=await db.doc('config/coding').get();cur=sn.exists?(sn.data()||{}).pin:null}catch(err){}
    if(cur&&(!f.dataset.chg||cHash($('#cs_old').value)!==cur)){$('#cs_err').textContent=f.dataset.chg?'كلمة السر الحالية غير صحيحة.':'توجد كلمة سر بالفعل.';return}
    if(await save(db.doc('config/coding'),{pin:cHash(n1),at:now,by:u.no})){codeOK=true;closeM();toast('تم حفظ كلمة سر التكويد');tab='coding';chrome();view()}}
  else if(f.id==='pinF'&&u){if(pinOf(u)!==hash(u.no,$('#pn_old').value)){$('#pn_err').textContent='الرقم الحالي غير صحيح.';return}
    if(await save(db.doc('pins/'+u.no),{pin:hash(u.no,$('#pn_new').value),at:now})){closeM();toast('تم تغيير الرقم السري')}}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-act],[data-score]');if(!b)return;
  if(b.dataset.tab){if(b.dataset.tab==='coding'&&!codeOK){codeGate();return}tab=b.dataset.tab;chrome();view();return}
  if(b.dataset.score){pick=+b.dataset.score;document.querySelectorAll('#scale button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#scalePrev').innerHTML=stars([pick],true);$('#dn_err').textContent='';return}
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='logout'){codeOK=false;meNo=null;if(usr&&usr.signOutOwner)usr.signOutOwner();ls.set('od_me',null);refresh()}
  else if(a==='rep'){repOpen.has(id)?repOpen.delete(id):repOpen.add(id);view()}else if(a==='toggle'){open.has(id)?open.delete(id):open.add(id);tab==='track'?drawTrack():view()}
  else if(a==='done')doneModal(id);else if(a==='back')backModal(id);else if(a==='skip')skipModal(id);else if(a==='editt')editModal(id);else if(a==='delt')delTaskModal(id);else if(a==='closeM')closeM();
  else if(a==='addp')personModal();else if(a==='editp')personModal(id);else if(a==='delp')delModal(id);else if(a==='mlcopy')mlCopy();else if(a==='fwd')fwdModal(id);else if(a==='fadd'){pendTask=id;$('#fileIn').click()}else if(a==='fview')fileModal(id,b.dataset.f);else if(a==='fget')fileGet(id,b.dataset.f,!!b.dataset.dl);else if(a==='fdel')fileDel(id,b.dataset.f);else if(a==='sync')syncNow();else if(a==='adds')secModal();else if(a==='edits')secModal(id);else if(a==='dels')delSec(id);else if(a==='pin')pinModal();else if(a==='expAll')exportData();else if(a==='impStart'){usr.isOwner().then(o=>o?importModal():ownerLogin('import'))}else if(a==='impPick'){$('#impIn').click()}else if(a==='codechg')codeSetModal(true);else if(a==='codelock'){codeOK=false;tab='mine';chrome();view();toast('تم قفل التكويد')}else if(a==='cskip')cskipModal(id,+b.dataset.i,!!b.dataset.un);else if(a==='addd')deptModal(null,b.dataset.sec);else if(a==='editd')deptModal(id);else if(a==='deld')delDept(id);else if(a==='rtog')recurToggle(id);else if(a==='rdel'){const r=recurs.find(x=>x.id===id);if(r)modal('<form id="rdelF" data-id="'+esc(id)+'" style="display:contents"><h2>حذف مهمة متكررة</h2><p>'+esc(r.title)+' · '+esc(REP[r.rep])+'</p><p>لن تُنشأ منها مهام جديدة. المهام التي أُنشئت منها قبل ذلك تبقى كما هي.</p><div class="row"><button class="btn danger">حذف</button><button type="button" class="btn" data-act="closeM">إلغاء</button></div></form>')}});
document.addEventListener('input',e=>{const el=e.target,id=el.id||'';
  if(id.startsWith('f_')){F[id.slice(2)]=el.value;drawTrack()}
  else if(id.startsWith('nt_')){draft[id.slice(3)]=el.value;if(id==='nt_sector'||id==='nt_to'||id==='nt_rep'||id==='nt_day'||id==='nt_dept')view()}
  else if(id.startsWith('pe_sec_')){const r=$('#pe_dep_'+el.value);if(r)r.hidden=!el.checked}
  else if(id==='starMonth'){starMonth=el.value;view()}
  else if(id==='li_no'){const p=staff[el.value.trim()];$('#li_who').innerHTML=p&&p.active!==false?av(p,'sm')+'<span>'+esc(p.name)+' · '+esc(tt(p))+'</span>':''}
  else if(id==='pe_photo'&&el.files[0])shrink(el.files[0]).then(d=>{photoData=d;$('#pe_prev').innerHTML=av({name:'',photo:d},'lg')}).catch(()=>toast('تعذر قراءة الصورة'))});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='impIn'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';importData(f)}});
$('#fileIn').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(pendTask&&fs.length)attach(pendTask,fs)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeM()});

/* ---------- boot ---------- */
async function boot(){view();const c=window.claude;if(!c||!c.use){view.tried=true;db=null;return view()}
  [db,usr]=await Promise.all([c.use('db'),c.use('user')]);view.tried=true;if(!db)return view();c.use('downloads').then(x=>{dl=x}).catch(()=>{});
  const dead=()=>toast('انقطع الاتصال بالبيانات. أعد فتح الصفحة.');
  db.collection('sectors').limit(500).onSnapshot(H.sectors=s=>{const d=s.docs.map(x=>[x.id,x.data()]).filter(x=>x[1]&&x[1].name).sort((a,b)=>(a[1].order||0)-(b[1].order||0)),m={},r={};d.forEach(x=>{m[x[0]]=x[1].name;r[x[0]]=x[1]});SECTORS=m;SECDATA=r;lastSync=new Date();refresh()},dead);
  db.collection('pins').limit(1000).onSnapshot(H.pins=s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.pin)m[d.id]=x});PINS=m},()=>{});
  db.collection('depts').limit(500).onSnapshot(H.depts=s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.name&&x.sector)m[d.id]=x});DEPTS=m;refresh()},dead);
  db.collection('staff').limit(1000).onSnapshot(H.staff=s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&ROLES[x.role])m[d.id]=x});staff=m;staffReady=true;lastSync=new Date();refresh()},dead);
  db.collection('tasks').limit(1000).onSnapshot(H.tasks=s=>{tasks=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).filter(t=>Array.isArray(t.chain)&&t.chain.length);tasksReady=true;lastSync=new Date();refresh();schedGen()},dead);
  db.collection('recur').limit(500).onSnapshot(H.recur=s=>{recurs=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).filter(r=>r&&r.rep);recurReady=true;const rb=$('#recurBox');if(rb&&me())rb.innerHTML=recurList(me());refresh();schedGen()},dead)}
boot();
})();
</script>
